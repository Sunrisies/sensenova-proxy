services:
  sensenova-proxy:
    image: sensenova-proxy:latest
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
